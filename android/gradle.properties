# 不要在这里加 -Dfile.encoding=UTF-8：
# Gradle 会用这个编码写测试 worker 的 @argfile，但 JVM 读 @argfile 用的是系统编码
# （中文 Windows 是 GBK）。项目路径一旦含中文，classpath 就会被读坏，
# 表现为 ClassNotFoundException —— 源码编码在下面的 build 脚本里单独指定。
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# 仓库放在「一键截图，发送给我的其他电脑」这类中文路径下是既定事实，
# 不覆盖这项检查 AGP 会直接拒绝构建。
android.overridePathCheck=true
